# Local demo stack. Secrets fall back to clearly marked dev-only values so that
# `docker compose up` works from a clean clone; copy .env.example to .env to override.
# The API refuses to start with dev-only secrets when APP_ENV=production.

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://ssi_app:${APP_DB_PASSWORD:-dev-only-insecure-app-pw}@db:5432/shopee_insights
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-please}
  PII_HASH_SECRET: ${PII_HASH_SECRET:-dev-only-insecure-pii-secret-change-me-please}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Shopee Open Platform (optional): the integration stays off until these are set.
  SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
  SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
  SHOPEE_API_HOST: ${SHOPEE_API_HOST:-https://partner.test-stable.shopeemobile.com}
  SHOPEE_REDIRECT_URL: ${SHOPEE_REDIRECT_URL:-http://localhost:8080/api/shopee/callback}
  SHOPEE_SYNC_INTERVAL_MINUTES: ${SHOPEE_SYNC_INTERVAL_MINUTES:-30}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopee_insights
      POSTGRES_USER: ssi_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-insecure-owner-pw}
      APP_DB_USER: ssi_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-insecure-app-pw}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssi_owner -d shopee_insights"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports": the database is reachable only inside the compose network.
    networks: [backend]

  api:
    build: ./backend
    image: shopee-seller-insights-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://ssi_owner:${POSTGRES_PASSWORD:-dev-only-insecure-owner-pw}@db:5432/shopee_insights
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-8080}"]'
      # Trust X-Forwarded-For only from the nginx container (fixed IP below).
      FORWARDED_ALLOW_IPS: ${WEB_IP:-172.28.0.10}
      # The local demo is plain http; production must keep Secure cookies (enforced).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    # No published port: reachable only through nginx (Swagger at /api/docs).
    networks: [backend, frontend]

  worker:
    # Same image as the API; runs the scheduled Shopee sync (idle if not configured).
    build: ./backend
    image: shopee-seller-insights-api
    entrypoint: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy  # migrations have been applied
    environment:
      <<: *app-env
    restart: unless-stopped
    healthcheck:
      # Healthy while the worker loop keeps refreshing its heartbeat file.
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend]

  web:
    build: ./frontend
    image: shopee-seller-insights-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      frontend:
        ipv4_address: ${WEB_IP:-172.28.0.10}

networks:
  backend:
  frontend:
    ipam:
      config:
        - subnet: ${FRONTEND_SUBNET:-172.28.0.0/24}

volumes:
  db-data:
